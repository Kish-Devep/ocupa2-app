name: ocupa2
description: "Ocupa2 - Plataforma de Trabajos Temporales (ITLA)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado e inyección de dependencias
  flutter_riverpod: ^2.5.1

  # Red y sesión
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Navegación
  go_router: ^14.6.2

  # Imágenes
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Mapas y ubicación
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Utilidades
  url_launcher: ^6.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  network_image_mock: ^2.1.1
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/team/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
